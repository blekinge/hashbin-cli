# ── Hashbin CLI (Quarkus Picocli) ───────────────────────────────────────
# A command-line tool, not a server: boot, run one command, exit.

# ── Packaging ───────────────────────────────────────────────────────────
# Single self-contained executable jar (`java -jar` works directly, no lib/
# layout), with no `-runner` suffix so the artifact is hashbin-cli-<version>.jar.
# The native profile overrides packaging, so this does not affect that build.
quarkus.package.jar.type=uber-jar
quarkus.package.jar.enabled=true
quarkus.package.jar.add-runner-suffix=false

# Smaller native binary.
quarkus.native.compression.level=5

# ── Runtime ─────────────────────────────────────────────────────────────
quarkus.banner.enabled=false
# No HTTP server on the classpath; never bind a port (safe as a Job/CronJob).
quarkus.http.host-enabled=false

# Graceful shutdown: on SIGTERM (Kubernetes deleting a Job/pod) Quarkus waits up to
# this long for the running command to finish before forcing exit. ISO-8601 so it
# parses under both Quarkus and the MicroProfile duration spec.
quarkus.shutdown.timeout=PT30S

# The REST client interfaces (net.hashbin.api.*Api) are generated into the
# hashbin-api dependency, which has no bean archive marker. Index it so Quarkus
# REST Client (and ArC) discover the @RegisterRestClient types at build time.
quarkus.index-dependency.hashbin-api.group-id=net.hashbin
quarkus.index-dependency.hashbin-api.artifact-id=hashbin-api

# ── Logging (12-factor: log to stdout, let the platform collect it) ─────
# The console handler accepts everything (level=ALL); the root level filters.
# --verbose raises the application's own categories to DEBUG before startup
# (see Main.main); DEBUG is also reachable the 12-factor way via QUARKUS_LOG_LEVEL.
quarkus.log.level=INFO
quarkus.log.console.enabled=true
quarkus.log.console.level=ALL
quarkus.log.category."io.quarkus".level=WARN
# Debug level for the application's OWN package (so --verbose shows its diagnostics
# without the Netty/SmallRye/etc. flood). --verbose raises app.log.level to DEBUG.
quarkus.log.category."net.hashbin".level=${app.log.level:INFO}
# Per-run correlation id carried on every log line (Quarkus's built-in instance UUID;
# the :local is a build-time placeholder never seen at runtime).
run.id=${quarkus.uuid:local}
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] [run ${run.id}] %s%e%n

# ── CLI defaults (overridable per-invocation or via environment) ──────────
# Resolution lives in Main (kept out of MicroProfile Config so the
# commands run identically under a plain `new CommandLine(...)` in unit tests).
# Precedence, highest first:
#   --api-base      > $HASHBIN_API_BASE      > http://localhost:8080/api
#   --hmac-secret   > $HASHBIN_HMAC_SECRET   > (signature check skipped)
#   --token         > $HASHBIN_TOKEN         > ~/.config/hashbin/credentials.json
#
# The default base URL targets a locally running backend (`mvn quarkus:dev` in
# the sibling hashbin-quarkus repo, which serves /api on 8080). Override for a
# deployed instance:  export HASHBIN_API_BASE=https://hashbin.net/api
